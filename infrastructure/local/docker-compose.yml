# Local stand-ins for the PoC data stores (plan §3.5). LOCAL DEV ONLY — synthetic data, not a cloud deployment.
#   postgres  -> Cloud SQL (PostgreSQL): app data, authz tuples, LangGraph checkpointer
#   valkey    -> Memorystore: cache only, never the session store
#   spanner   -> Spanner emulator for GraphRepository development (verify graph/GQL support before relying on it)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10
  valkey:
    image: valkey/valkey:8
    ports: ["127.0.0.1:6379:6379"]
  spanner:
    image: gcr.io/cloud-spanner-emulator/emulator:latest
    ports: ["127.0.0.1:9010:9010", "127.0.0.1:9020:9020"]
volumes:
  pgdata:
