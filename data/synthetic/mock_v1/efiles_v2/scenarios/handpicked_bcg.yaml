       rule: AP-GAD01-GOMS-34-2020, anchor: "contract basis for a period of 3 years",
       synthetic_doc: {kind: Memo, issuer: "Office of the Director General, ACB (SYNTHETIC)", number: "Memo.No.SYN-55/Adm/2020", date: "2020-05-28",
                       text: "The Chief Legal Advisor may be appointed on contract basis for a period of five years."},
       reason: "The note appoints the Chief Legal Advisor for five years under the memo; the A.P. Anti-Corruption Service Rules as amended (G.O.Ms.No.34, 15-04-2020) fix the appointment on tenure / contract basis at 3 years. Review against the Rules."}
    - {id: C1, type: C, section: SER-A, date: "2017-09-05", subject: "Ratification of transfers of Deputy Collectors ordered by another department",
       proposal: "the transfer orders of Deputy Collectors already issued by the Revenue Department may be ratified",
       rule: AP-GAD01-GOMS-74-2017, anchor: "Transfers and Postings of Deputy Collectors and Special Grade Deputy Collectors",
       reason: "Since G.O.Ms.No.74 (14-06-2017) the Business Rules allot 'Transfers and Postings of Deputy Collectors and Special Grade Deputy Collectors' to the General Administration Department; the note proposes to ratify orders another department issued."}
    - {id: C2, type: C, section: SER-A, date: "2018-02-12", subject: "Postings of Special Grade Deputy Collectors — proposal from a district",
       proposal: "the proposal may be returned to the Revenue Department, being the department concerned with postings of Special Grade Deputy Collectors",
       rule: AP-GAD01-GOMS-74-2017, anchor: "Transfers and Postings of Deputy Collectors and Special Grade Deputy Collectors",
       reason: "The note returns the proposal to the Revenue Department as the competent department; the subject was allotted to the General Administration Department by G.O.Ms.No.74 (14-06-2017)."}
    - {id: C3, type: C, section: CABINET-II, date: "2017-10-16", subject: "Proposal on Rajiv Swagruha Corporation routed as a Housing Department subject",
       proposal: "the proposal may be circulated as a subject of the Housing Department",
       rule: AP-GAD01-GOMS-99-2017, anchor: "Under the heading .22 Municipal Administration & Urban Development Department.{0,80}shall be inserted",
       reason: "The note circulates the proposal as a Housing Department subject; G.O.Ms.No.99 (04-08-2017) moved Rajiv Swagruha Corporation, the A.P. State Housing Board and DIL to MA&UD."}
    - {id: C4, type: C, section: CABINET-II, date: "2018-01-08", subject: "A.P. State Housing Board — reference from the Housing Department for orders",
       proposal: "the Housing Department may be treated as the administrative department for the A.P. State Housing Board",
       rule: AP-GAD01-GOMS-99-2017, anchor: "the following subject shall be omitted",
       reason: "The note accepts the Housing Department as the administrative department for the Housing Board; the subject was omitted from Housing and allotted to MA&UD (G.O.Ms.No.99, 04-08-2017)."}
    - {id: C5, type: C, section: CABINET-II, date: "2017-03-28", subject: "Corporate bodies for tourism and culture — allocation query",
       proposal: "the heritage corporation may be placed under the Municipal Administration & Urban Development Department",
       rule: AP-GAD01-GOMS-32-2017, anchor: "All corporate bodies created in relation to Tourism, Culture and Heritage",
       reason: "The note places a heritage corporation with another department; the First Schedule as substituted by G.O.Ms.No.32 (10-03-2017) lists all corporate bodies for Tourism, Culture and Heritage under Youth Advancement, Tourism and Culture."}
    - {id: B1, type: B, section: SER-A, date: "2023-07-03", subject: "Counting of deputation period for seniority",
       rule: AP-GAD01-GOMS-95-2021, anchor: "State & Subordinate Service Rules|State and Subordinate Service Rules",
       synthetic_doc: {kind: Memo, issuer: "Services wing (SYNTHETIC)", number: "Memo.No.SYN-71/Ser/2023", date: "2023-05-15",
                       text: "Deputation within the State shall count for seniority in the parent cadre."},
       synthetic_doc_2: {kind: Memo, issuer: "Services wing (SYNTHETIC)", number: "Memo.No.SYN-84/Ser/2023", date: "2023-06-12",
                       text: "Deputation shall not count for seniority in the parent cadre."},
       reason: "Two memos of the same wing say opposite things on the same question; the note follows one of them. Review recommended."}
    - {id: B2, type: B, section: CABINET-II, date: "2019-09-02", subject: "Circulation of a proposal to the Council of Ministers",
       rule: AP-GAD01-GOMS-32-2017, anchor: "Business Rules",
       synthetic_doc: {kind: Circular, issuer: "Cabinet wing (SYNTHETIC)", number: "Cir.No.SYN-12/Cab/2019", date: "2019-07-01",
                       text: "Proposals shall reach the Cabinet wing seven days before the meeting."},
       synthetic_doc_2: {kind: Circular, issuer: "Cabinet wing (SYNTHETIC)", number: "Cir.No.SYN-15/Cab/2019", date: "2019-08-05",
                       text: "Proposals shall reach the Cabinet wing three days before the meeting."},
       reason: "Two circulars of the same wing fix different lead times; the note applies the earlier one. Review recommended."}
  FIN01:
    # 13 Nov 2026 (owner OK): was G1 / type G. Gazette 3644 publishes a Finance circular memo, the same level as the
    # synthetic instruction, so the conflict is same-level (B), not lower-against-higher (G).
    - {id: B4, type: B, section: HR-III, date: "2024-03-11", subject: "Counting of contract service towards qualifying service for pension",
       rule: AP-GAZ-GAZETTE-EI-3644-2024, anchor: "Service rendered casual/contract/part time/ hourly basis etc., is not a substantive appointment",
       synthetic_doc: {kind: Instruction, issuer: "District Treasury Officer (SYNTHETIC)", number: "Lr.No.SYN-301/Pen/2024", date: "2024-02-20",
                       text: "Contract service preceding regular appointment shall be counted in full for pension."},
       reason: "The pension proposal counts contract service under the DTO's instruction; the Finance Department's circular memo (published in the Gazette, 05-01-2024) says casual / contract service is not substantive and is not counted. Two instruments of the same level say opposite things."}
    - {id: G2, type: G, section: HR-III, date: "2024-06-17", subject: "Second voluntary enhancement of APGLI premium in a financial year",
       rule: AP-GAZ-GAZETTE-EI-3880-2024, anchor: "avail it only once in a financial year",
       synthetic_doc: {kind: Circular, issuer: "APGLI district office (SYNTHETIC)", number: "Cir.No.SYN-9/APGLI/2024", date: "2024-05-30",
                       text: "Voluntary enhancement of premium may be allowed twice in a financial year."},
       reason: "The note allows a second enhancement in the same financial year following the circular; the A.P. Government Life Insurance Fund Rules, 2024 allow it only once."}
    - {id: G3, type: G, section: HR-III, date: "2024-07-08", subject: "Enhancement of APGLI premium above 8% without medical examination",
       rule: AP-GAZ-GAZETTE-EI-3880-2024, anchor: "above 8% and up to 15% of basic pay, on self\\s*-\\s*declaration and compulsory medical examination",
       synthetic_doc: {kind: Circular, issuer: "APGLI district office (SYNTHETIC)", number: "Cir.No.SYN-14/APGLI/2024", date: "2024-06-21",
                       text: "Enhancement up to 15% of basic pay may be allowed on self-declaration."},
       reason: "The note waives the medical examination following the circular; the APGLI Fund Rules, 2024 require it for premium above 8% and up to 15% of basic pay."}
