    - {id: C4, type: C, section: BUDGET-I, date: "2016-08-22", subject: "Additional funds requested in the second quarter",
       proposal: "additional funds may be released as requested",
       rule: AP-FIN01-GOMS-51-2016, anchor: "no request for additional funds or re-appropriation will be entertained in the first two quarters",
       reason: "The note processes a request for additional funds in August 2016 (second quarter), against para 11 of G.O.Ms.No.51."}
    - {id: B1, type: B, section: HR-III, date: "2023-09-11", subject: "Commutation of pension — date of effect",
