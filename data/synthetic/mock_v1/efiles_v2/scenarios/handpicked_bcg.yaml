    - {id: B3, type: B, section: BUDGET-I, date: "2016-07-04", subject: "Expenditure before the Comprehensive Budget Release Order",
       rule: AP-FIN01-GOMS-51-2016, anchor: "until the issue of CBRO by the Finance Department",
