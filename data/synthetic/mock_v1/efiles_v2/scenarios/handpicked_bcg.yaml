# SYNTHETIC set v2 — hand-picked B / C / G scenarios (ADR-0020), read against the real orders on 13 Nov 2026.
# `anchor` is a regex that must match the real order's own text: build_scenarios_v2.py copies the quote from there and
# refuses the entry if the anchor is not found. `synthetic_doc` = a LABELLED SYNTHETIC lower instrument (district /
# section circular, proceedings, memo) written for the scenario. It is never a G.O., and never claims to be real.
# Types: G = a lower instrument contradicts a higher one (Rules > G.O. > circular); C = wrong authority / procedure;
# B = two instruments of the same level contradict each other (both synthetic circulars citing the same real rule).
departments:
  ESE01:
    - {id: G1, type: G, section: SERVICES-II, date: "2017-06-12", subject: "Request transfer of a School Assistant with one year of service in the present school",
       rule: AP-ESE01-GOMS-32-2017, anchor: "minimum period of two years-service in a School",
       synthetic_doc: {kind: Proceedings, issuer: "District Educational Officer, Krishna (SYNTHETIC)", number: "Rc.No.SYN-412/A1/2017", date: "2017-06-08",
                       text: "Teachers who have completed one year of service in the present school are eligible to apply for transfer."},
       reason: "The note admits the request under the DEO proceedings (one year of service); the Transfer Rules issued in G.O.Ms.No.32 (Rules, under the A.P. Education Act) require a minimum of two years. A lower instrument cannot relax the Rules."}
    - {id: G2, type: G, section: SERVICES-II, date: "2017-06-14", subject: "Exemption from compulsory transfer — teacher with eight years in the school",
       rule: AP-ESE01-GOMS-32-2017, anchor: "completed 8 Academic calendar years of service",
       synthetic_doc: {kind: Circular, issuer: "Regional Joint Director of School Education, Kakinada (SYNTHETIC)", number: "Cir.No.SYN-27/2017", date: "2017-06-09",
                       text: "Teachers shall be shifted compulsorily only after completing ten academic years in a school."},
       reason: "The note keeps a teacher with eight academic years in the school by following the RJD circular (ten years); Rule 2(i)(a) of the Transfer Rules (G.O.Ms.No.32) makes eight years compulsory."}
    - {id: G3, type: G, section: SERVICES-II, date: "2025-06-10", subject: "Compulsory transfer list — teachers with eight academic years",
       rule: AP-ESE01-GOMS-22-2025, anchor: "completed eight \\(8\\) academic years of service in a particular school",
       synthetic_doc: {kind: Proceedings, issuer: "District Educational Officer, Guntur (SYNTHETIC)", number: "Rc.No.SYN-88/B2/2025", date: "2025-06-02",
                       text: "Only teachers who have completed ten academic years in the school shall be included in the compulsory list."},
       reason: "The compulsory list follows DEO proceedings (ten years); the A.P. State Teachers (Regulation of Transfers) Rules, 2025 (G.O.Ms.No.22) fix eight years."}
    - {id: G4, type: G, section: SERVICES-II, date: "2025-06-11", subject: "Compulsory transfer — Headmaster Gr.II with five years in the school",
       rule: AP-ESE01-GOMS-22-2025, anchor: "Headmasters \\(Gr.II\\) who have completed five \\(5\\) academic years",
       synthetic_doc: {kind: Circular, issuer: "District Educational Officer, Prakasam (SYNTHETIC)", number: "Cir.No.SYN-19/2025", date: "2025-06-03",
                       text: "Headmasters Gr.II shall be shifted only after completing six academic years in the school."},
       reason: "The note retains a Headmaster Gr.II with five years by following the DEO circular (six years); Rule 2(a) of the 2025 Rules fixes five years."}
    - {id: C1, type: C, section: SERVICES-II, date: "2025-06-12", subject: "Issue of transfer orders to teachers after web counselling",
       proposal: "the District Educational Officer may issue the transfer orders on the basis of the counselling lists, without waiting for the Committee",
       rule: AP-ESE01-GOMS-22-2025, anchor: "Transfer orders shall be issued by the competent authority with the approval of the respective Committees",
       reason: "The note proposes that the DEO issue the orders directly; under the 2025 Rules orders issue only with the approval of the respective Committee. Procedure not followed."}
    - {id: C2, type: C, section: SERVICES-II, date: "2025-06-18", subject: "Transfer of a Headmaster Gr.II in a ZP High School",
       proposal: "the District Educational Officer, as the transferring authority, may issue orders transferring the Headmaster Gr.II",
       rule: AP-ESE01-GOMS-22-2025, anchor: "The Committee shall be the competent authority for transfer of all the Headmasters",
       reason: "The note treats the DEO as the transferring authority; the 2025 Rules make the district Committee the competent authority for Headmasters (Gr.II) in ZP High Schools."}
    - {id: C3, type: C, section: SERVICES-II, date: "2025-06-20", subject: "Transfer of a Headmaster Gr.II on request — orders by the Regional Joint Director",
       proposal: "the transfer orders already issued by the Regional Joint Director may be ratified",
       rule: AP-ESE01-GOMS-22-2025, anchor: "The Committee shall be the competent authority for transfer of all the Headmasters",
       reason: "Orders already issued by the RJD are put up for ratification; for Headmasters (Gr.II) in ZP High Schools the competent authority is the Committee. Wrong authority."}
    - {id: B1, type: B, section: SERVICES-II, date: "2020-11-06", subject: "Counting of the academic year for compulsory transfer",
       rule: AP-ESE01-GOMS-54-2020, anchor: "more than half the Academic year would be considered as a complete full year",
       synthetic_doc: {kind: Circular, issuer: "District Educational Officer, West Godavari (SYNTHETIC)", number: "Cir.No.SYN-41/2020", date: "2020-10-20",
                       text: "Only completed academic years shall be counted; part of a year shall be ignored."},
       synthetic_doc_2: {kind: Circular, issuer: "District Educational Officer, West Godavari (SYNTHETIC)", number: "Cir.No.SYN-44/2020", date: "2020-10-27",
                       text: "More than half of an academic year shall be counted as a full year."},
       reason: "Two circulars of the same office, a week apart, count the academic year differently; the note cites both. The 2020 Guidelines (G.O.Ms.No.54) count more than half a year as a full year."}
    - {id: B2, type: B, section: EXAMS, date: "2023-02-14", subject: "Validity of the Teacher Eligibility Test certificate",
       rule: AP-ESE01-GOMS-25-2018, anchor: "Teacher Eligibility Test",
       synthetic_doc: {kind: Circular, issuer: "Director of Government Examinations (SYNTHETIC)", number: "Cir.No.SYN-7/2023", date: "2023-01-10",
                       text: "A TET certificate is valid for seven years from the date of the result."},
       synthetic_doc_2: {kind: Circular, issuer: "Director of Government Examinations (SYNTHETIC)", number: "Cir.No.SYN-11/2023", date: "2023-01-24",
                       text: "A TET certificate is valid for life."},
       reason: "Two circulars of the same authority give different validity for the same certificate; the note relies on the first without reconciling them. Review recommended."}
    - {id: B3, type: B, section: PROGRAM-I, date: "2021-08-09", subject: "Admission age for Class I under the RTE Rules",
       rule: AP-ESE01-GOMS-20-2011, anchor: "Right of Children to Free and Compulsory Education",
       synthetic_doc: {kind: Circular, issuer: "Commissioner of School Education (SYNTHETIC)", number: "Cir.No.SYN-102/2021", date: "2021-06-14",
                       text: "Children who complete five years by 1st June shall be admitted to Class I."},
       synthetic_doc_2: {kind: Circular, issuer: "Commissioner of School Education (SYNTHETIC)", number: "Cir.No.SYN-131/2021", date: "2021-07-05",
                       text: "Children who complete six years by 1st June shall be admitted to Class I."},
       reason: "Two circulars of the same authority set different admission ages; the note follows the later one without noting the earlier. Review recommended."}
  GAD01:
    - {id: G1, type: G, section: SER-A, date: "2022-03-10", subject: "Age relaxation to SC/ST candidates in a direct recruitment",
       rule: AP-GAD01-GOMS-95-2021, anchor: "This age concession in favour of Scheduled Castes / Scheduled Tribes will be in force upto 31.5.2026",
       synthetic_doc: {kind: Memo, issuer: "Recruiting unit, Commissionerate (SYNTHETIC)", number: "Memo.No.SYN-206/Rect/2022", date: "2022-02-21",
                       text: "The age concession to SC/ST candidates lapsed on 31.05.2021 and shall not be allowed."},
       reason: "The note withdraws the SC/ST age concession following the memo; the State & Subordinate Service Rules as amended by G.O.Ms.No.95 (02-09-2021) keep it in force up to 31.5.2026."}
    - {id: G2, type: G, section: SER-A, date: "2024-01-18", subject: "Upper age limit for SC/ST candidates — notification for recruitment",
       rule: AP-GAD01-GOMS-95-2021, anchor: "This age concession in favour of Scheduled Castes / Scheduled Tribes will be in force upto 31.5.2026",
       synthetic_doc: {kind: Circular, issuer: "Head of Department, recruitment wing (SYNTHETIC)", number: "Cir.No.SYN-3/2024", date: "2024-01-05",
                       text: "No age concession shall be allowed to any category in recruitments notified in 2024."},
       reason: "The draft notification follows the circular and omits the SC/ST concession, which Rule 12 (as amended, G.O.Ms.No.95) keeps until 31.5.2026."}
    # 14 Nov 2026: was a vague "method of appointment" memo that named no post, so nothing could be compared. Now the
    # rule's own clause for one post (Chief Legal Advisor: 3 years, terminable with 3 months' notice).
