       proposal: "the permitted vacancies may be filled by the Head of the Department through recruitment at the department level",
       rule: AP-FIN01-GOMS-110-2016, anchor: "posts come under the purview of A\\.P\\. Public Service Commission",
       reason: "The note lets the Head of the Department fill the permitted vacancies; G.O.Ms.No.110 (17-06-2016) places them under the A.P. Public Service Commission and the State Level Police Recruitment Board. Wrong authority."}
    - {id: C2, type: C, section: HR-I, date: "2016-11-21", subject: "Direct recruitment — notification issued by a department on its own",
       proposal: "the recruitment notification already issued by the Head of the Department may be ratified",
       rule: AP-FIN01-GOMS-110-2016, anchor: "agencies are hereby instructed to issue schedule for recruitment",
       reason: "The note ratifies a notification the Head of the Department issued; under G.O.Ms.No.110 (17-06-2016) the recruiting agencies (APPSC, SLPRB) issue the schedule and the notification. Wrong authority."}
    - {id: C3, type: C, section: BUDGET-I, date: "2016-05-16", subject: "Request for re-appropriation of funds in the first quarter",
       proposal: "re-appropriation of funds may be sanctioned as requested",
       rule: AP-FIN01-GOMS-51-2016, anchor: "no request for additional funds or re-appropriation will be entertained in the first two quarters",
