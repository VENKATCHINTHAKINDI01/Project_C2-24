# SYNTHETIC officers for efiles_v2 (ADR-0020). Names are invented; they are NOT real officials.
# The structure is real and public:
#   - post ladder and file flow: A.P. Secretariat Office Manual, ch.1 (apcooperation.nic.in/open_record.php?ID=176):
#     ASO puts up a note -> SO revises/submits -> Assistant Secretary -> Deputy/Joint/Additional Secretary ->
#     Secretary decides (or circulates to the Minister); "Section Officer heads a section";
#     MCR HRD Institute, "Structure of Government" (typical department chart);
#   - section names and signing designations: from our real G.O.s 2016-2025 (section field counts and signature
#     blocks: e.g. FIN01 HR-I Plg & Policy 88 orders, HR-III-PENSION-GPF 28, BUDGET-I 57; GAD01 SER-A 42, CABINET-II 63,
#     SC-F 8; ESE01 SERVICES-II 31, PROGRAM-I 14 (16 verified amendment chains), EXAMS 30).
# 13 Nov 2026: FIN section A changed PC-TA -> HR-I (Plg & Policy) and ESE section B PROGRAM-II -> PROGRAM-I, because
# those sections hold most of the verified real-order chains (stage 1); files stay only in staffed sections.
# Mock, [To confirm] with the department: which sections are restricted, clearances, search scopes, and the
# delegation that lets a Section Officer dispose of a matter.
# search_scope (plan §11.4): Section < Section Hierarchy < Department < Global.
# 13 Nov 2026: heads moved from Global to Department scope. The C2-24 policy (access_policy.yaml) never opens another
# department's non-public papers, so a Global head would have been ALLOWED in access_matrix.csv but denied by the app.
# 7 per department, one more than the earlier 6, so the real chain includes the Assistant Secretary (owner, 13 Nov 2026:
# "use the official hierarchy").
departments:
  FIN01:
    name: Finance Department
    sections:
      HR-I:         {label: "Finance (HR.I-Plg. & Policy) Department", subjects: [recruitment, outsourcing, contract employees, transfers, creation of posts], restricted: false}
      HR-III:       {label: "Finance (HR.III-Pension & GPF) Department", subjects: [pension, family pension, dearness relief, GPF, gratuity], restricted: false}
      BUDGET-I:     {label: "Finance (Budget.I) Department", subjects: [budget release, vote on account, re-appropriation], restricted: true}
    head: {designation: "Principal Secretary to Government", seen_as: ["PRINCIPAL SECRETARY", "SPECIAL CHIEF SECRETARY"]}
  GAD01:
    name: General Administration Department
    sections:
      SER-A:        {label: "General Administration (Ser.A) Department", subjects: [service rules, recruitment, seniority, deputation], restricted: false}
      CABINET-II:   {label: "General Administration (Cabinet.II) Department", subjects: [business rules, allocation of business, creation of departments], restricted: false}
      SC-F:         {label: "General Administration (SC.F) Department", subjects: [Anti-Corruption Bureau, disciplinary cases], restricted: true}
    head: {designation: "Secretary to Government (Services)", seen_as: ["SECRETARY TO GOVERNMENT (SER.)", "SECRETARY TO GOVERNMENT"]}
  ESE01:
    name: School Education Department
    sections:
      SERVICES-II:  {label: "School Education (Services.II) Department", subjects: [teacher transfers, teacher service rules, promotions], restricted: false}
      PROGRAM-I:    {label: "School Education (Prog.I) Department", subjects: [Right to Education rules, schemes, school programmes], restricted: false}
      EXAMS:        {label: "School Education (Exams) Department", subjects: [public examinations, question papers, results], restricted: true}
    head: {designation: "Principal Secretary to Government", seen_as: ["PRINCIPAL SECRETARY", "SPECIAL CHIEF SECRETARY"]}

