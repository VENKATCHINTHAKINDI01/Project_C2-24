[project]
name = "c2-24-backend"
version = "0.1.0"
description = "C2-24 AI-enabled institutional memory & conflict detection — FastAPI modular monolith (plan §3.5)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",           # API layer (plan §3.5)
    "uvicorn[standard]>=0.30",  # ASGI server for local dev and Cloud Run
    "pydantic>=2.8",            # schemas at every module boundary (CLAUDE.md §11.2)
    "pydantic-settings>=2.4",   # typed env-based settings
    "pyyaml>=6.0",              # versioned config files (plan §14.2)
    "pypdf>=5.0",               # per-page text-layer detection before routing (plan §4.1); pure Python, BSD
]

[project.optional-dependencies]
# Installed only when the phase that needs them starts (`uv sync --extra <name>`).
agents = [
    "langgraph>=0.2",                     # orchestration over typed AgentState (plan §3.4)
    "langgraph-checkpoint-postgres>=2.0", # session memory in Cloud SQL, not Redis (plan §10.1)
    "psycopg[binary]>=3.2",               # Postgres driver (authz tuples, checkpointer)
]
gcp = [
    "google-cloud-storage>=2.16",         # raw documents
    "google-cloud-documentai>=2.29",      # OCR / extraction (plan §4.1)
    "google-cloud-bigquery>=3.25",        # L0/L1 metadata, audit, query log
    "google-cloud-spanner>=3.47",         # Spanner Graph, L3
    "google-cloud-discoveryengine>=0.12", # Vertex AI Search, L2
    "google-cloud-secret-manager>=2.20",
    "google-genai>=1.0",                  # Gemini + embeddings on Vertex AI (vertexai=True)
    "cloud-sql-python-connector[pg8000]>=1.12",
]
cache = [
    "redis>=5.0",                         # Memorystore Valkey/Redis — cache only (plan §10.2)
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",        # FastAPI TestClient
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "duckdb>=1.1",        # runs the BigQuery rung templates in tests (no cloud needed)
    "fakeredis>=2.26",    # Redis cache tests without a server (ADR-0035)
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
markers = [
    "integration: needs real cloud services/credentials; excluded by default (CLAUDE.md §11.13)",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "../evaluation"]
