# Versioned runtime settings (plan §14.2). Change → bump `version` and run the regression harness (CLAUDE.md §9.5).
# `null` = not yet calibrated. Code must treat an uncalibrated value as "not configured", never guess a default.
version: "2026-11-24-l2-uncalibrated"

ingestion:
  extraction_confidence_min: null   # confidence gate (plan §4.2) — calibrate in P1 on the synthetic scans

retrieval:
  l2_top_k: null                    # capped top-K for Vertex AI Search (plan §3.2) — calibrate in P3
  l2_rerank_min_score: null         # L2 early-exit threshold: set ONLY by a measured calibration (ADR-0061)
  l3_max_hops: null                 # graph expansion depth — set in P3/P4
  l3_max_nodes: 50                  # operational starting limit for graph traversal fan-out
  l3_max_edges: 100                 # operational starting limit for edge traversal fan-out
  # ADR-0061 addendum (24 Nov 2026): the 20 Nov "calibration" used hard-coded scores, not a
  # retriever, so it is withdrawn. evaluation/calibrate_l2.py --backend cloud writes a measured one.
  l2_calibrated: false
  l2_calibration_metadata: null

cache:
  answer_ttl_seconds: null          # Layer 2 authorised answers, "short TTL" (plan §10.2) — set in P3
  artifact_ttl_seconds: null
  reworded_repeats: true            # plan §10.3 semantic cache: same scope + anchors + content words (ADR-0053)
