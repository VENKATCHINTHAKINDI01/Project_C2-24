# SANDBOX ONLY — mock e-Office demo (plan §11). These are the evaluation harness's TEST values
# (evaluation/slots_v1.json), NOT calibrated thresholds. Used only while runtime.yaml is uncalibrated
# AND the connector is the mock adapter; every assist response then says "calibrated": false.
version: "2026-11-04-sandbox"
calibrated: false
# Replays: letters held back at startup so their arrival can be shown live (C2_SANDBOX_REPLAY=<name>).
# Corpus file names only. "tp04": G.O.Ms.31/2025 arrives after the records that depend on it.
replays:
  tp04:
    - D04_FIN01-GOMS-31-2025.pdf
# MOCK, [To confirm] against the AP Business Rules (who approves depends on the subject): posts that
# may approve, sign (simulated click) and issue a draft for approval put up to them. The author never
# approves their own draft. Issued orders get SYNTHETIC numbers from 9001 (ADR-0045).
order_approval:
  approver_posts: ["Assistant Secretary", "Deputy Secretary", "Secretary to Government"]
retrieval:
  l2_top_k: 10
  l2_rerank_min_score: 1.0
  l3_max_hops: 2
# Touchpoint 7 (referencing in a note): keyword stand-in for meaning-based matching. TEST values.
references:
  min_terms: 2          # shared words a paragraph needs (capped at the request's own word count)
  max_suggestions: 3
# OCR: replay the RECORDED Document AI responses for the synthetic scans (ADR-0017, model pinned in
# settings). No GCP calls. Scans still wait for a reviewer (the confidence gate is uncalibrated).
ocr:
  provider: recorded
  # OWNER DECISION 13 Nov 2026 (ADR-0020), sandbox v2/both only: a real PUBLIC order (public://,
  # UNCLASSIFIED) whose lowest OCR page confidence is at least this value is indexed without waiting
  # for a reviewer. Not a calibrated gate, not a human review: listed as auto-passed. Synthetic scans
  # and anything classified still wait for a reviewer.
  public_auto_pass_min_confidence: 0.80
# MOCK monitoring officer (owner request 15 Nov 2026; ADR-0035): signs in to the monitoring pad
# (activity, questions asked, frequent questions, officers, cache). No files of their own: their
# search scope reaches nothing beyond public orders. Clearance decides which questions' words they
# may read (a question asked under a higher clearance is shown without its words).
monitoring:
  officers:
    - user_id: M01
      name: "Monitoring Officer (mock)"
      post: "Monitoring Officer, C2-24 Assist"
      role_rank: 0
      department: GAD01
      section: null
      clearance: SECRET
      search_scopes: [individual]

# MOCK directory for C2_IDENTITY=iap (ADR-0039): the e-mail IAP verified → the e-Office user it
# signs in as. Placeholder addresses only (example.org is reserved); a real deployment reads the
# department's employee master through the connector. Unused in the default sandbox sign-in.
directory:
  so.estt.one@example.org: U01
  as.estt@example.org: U02
  so.vigilance@example.org: U04
  monitor@example.org: M01
